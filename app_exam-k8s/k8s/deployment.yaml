apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostname-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webserver
  template:
    metadata:
      name: my-webserver
      labels:
        app: webserver
    spec:
      imagePullSecrets: #docker hub 관련 정보 추가
        - name: dockerhub-secret #docker hub 관련 정보 추가
      containers:
        - name: my-webserver
          image: sjkim686/echo-hostname:b3e6b01ad38ed9ef91997344291f07a188d473b8
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
